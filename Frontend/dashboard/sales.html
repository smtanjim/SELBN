<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Dashboard – SEL</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="dash">
  <aside class="sidebar">
    <div class="brand">S<em>E</em>L</div>
    <nav class="nav">
      <a class="active" data-target="overview">📊 Overview</a>
      <a data-target="leads">📞 Leads &amp; Quotations</a>
    </nav>
    <div class="logout"><button id="logoutBtn" class="btn-logout">Log out</button></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div><h1 id="hello">Welcome</h1><p class="sub">Sales Executive Dashboard</p></div>
      <div class="user-chip"><div class="avatar" id="avatar">?</div><div><strong id="userName">…</strong><small id="userRole"></small></div></div>
    </div>

    <section id="overview"><div class="stats" id="stats"></div></section>

    <section id="leads" class="card">
      <div class="card-head"><h3>Leads &amp; Quotations</h3><input id="leadSearch" class="search" placeholder="Search leads…"></div>
      <table>
        <thead><tr><th>Client</th><th>Contact</th><th>Quotation</th><th>Value</th><th>Status</th></tr></thead>
        <tbody id="leadBody"></tbody>
      </table>
    </section>
  </main>
</div>
<script src="../js/main.js"></script>
<script>
  initDashboard({
    role: "sales_executive",
    statsUrl: API.sales.stats,
    statDefs: [
      { key: "newLeads", label: "New Leads" },
      { key: "quotesSent", label: "Quotations Sent" },
      { key: "dealsWon", label: "Deals Won" },
      { key: "pipelineValue", label: "Pipeline Value", money: true }
    ],
    tables: [{
      url: API.sales.leads, bodyId: "leadBody", searchId: "leadSearch",
      columns: [
        { key: "client" }, { key: "contact" }, { key: "quotation" },
        { key: "value", render: v => money(v) },
        { key: "status", render: v => badge(v) }
      ]
    }]
  });
</script>
</body>
</html>
